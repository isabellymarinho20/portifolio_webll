<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Novo Certificado</title>
<link rel="stylesheet" href="./novoProjeto.css">
</head>

<body>

<section class="admin-section">

<div class="admin-container">

<h2 class="admin-title">Adicionar Certificado</h2>

<form id="formCertificado" class="admin-form">

<input type="text" id="tituloCert" placeholder="Título" required>

<input type="text" id="instCert" placeholder="Instituição" required>

<input type="text" id="categoriaCert" placeholder="Categoria" required>

<button class="admin-btn">Adicionar Certificado</button>

</form>


<h3 style="margin-top:20px;">Certificados cadastrados</h3>

<div class="cert_grid"></div>

<button onclick="salvarEdicaoCert()" class="admin-btn" style="margin-top:10px;">
Atualizar Certificado
</button>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
